<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gökhan Budak – Car Competence Center</title>

  <!-- ✅ Google Fonts: Outfit -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#ffffff;
      --fg:#1f2328;
      --btn:#ffffff;
      --btn-border:#e5e7eb;
      --btn-hover:#f8fafc;
      --shadow:0 8px 24px rgba(0,0,0,.06);
      --radius:16px;
      --anthrazit:#2F2F2F;
      --icon:#2F2F2F;
      --line:#d4d4d4;
    }

    *{box-sizing:border-box}

    body{
      margin:0; 
      min-height:100vh;
      display:flex; 
      align-items:flex-start;
      justify-content:center;
      padding-top:15px;
      background:var(--bg); 
      color:var(--fg);
      font-family:"Urbanist", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-weight:400;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .card{ 
      width:min(92vw,520px); 
      padding:24px; 
      text-align:center; 
    }

    .logo{ 
      width:250px; 
      height:auto; 
      margin:0 auto 1px; 
      display:block; 
    }

    h1{
      margin:20px 0 0; 
      font-size:1.9rem;
      color:var(--anthrazit);
      letter-spacing:.2px;
      font-weight:400;
    }

    h1 span:first-child { font-weight:500; }
    h1 span:last-child { font-weight:700; }

    .role{
      margin:-5px 0 0; 
      font-size:1.05rem;
      font-weight:500;
      color:#374151;
    }

    .subrole{
      margin:20px 0 8px;
      font-size:0.78rem;
      font-weight:500;
      color:#4b5563;
      line-height:1.25;
      letter-spacing:-0.2px;
      white-space:nowrap;
    }

    .quote-container{
      position:relative;
      margin:12px auto 16px;
      padding:10px 0;
      width:100%;
      max-width:420px;
    }

    .quote-container::before,
    .quote-container::after{
      content:"";
      position:absolute;
      left:0; right:0;
      border-top:1px solid var(--line);
      transform:translateZ(0);
    }

    .quote-container::before{ top:0; }
    .quote-container::after{ bottom:0; }

    .quote{
      font-size:0.82rem;
      font-style:italic;
      color:#2f2f2f;
      margin:0;
      line-height:1.45;
    }

    .grid{ 
      display:grid; 
      gap:12px; 
      margin-top:8px; 
    }

    .btn{
      display:flex; 
      align-items:center; 
      justify-content:flex-start;
      gap:12px;
      padding:14px 16px; 
      border-radius:var(--radius);
      background:var(--btn); 
      border:1px solid var(--btn-border);
      text-decoration:none; 
      color:var(--fg); 
      box-shadow:var(--shadow);
      transition:background .15s ease, transform .04s ease, border-color .15s ease, filter .15s ease;
      font-weight:500;
      text-align:left;
      cursor:pointer;
    }

    .btn:hover{ background:var(--btn-hover); border-color:#dfe3e8; }
    .btn:active{ transform:translateY(1px); }

    .ico{ 
      width:22px; 
      height:22px; 
      display:grid; 
      place-items:center; 
      color:var(--icon);
    }

    .ico svg{
      width:22px;
      height:22px;
      stroke:currentColor;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
      display:block;
    }

    .txt{ 
      font-size:1.02rem; 
      font-weight:600; 
      font-variant-numeric:tabular-nums; 
    }

    @media (max-width:380px) {
      .subrole { font-size:0.75rem; }
      .quote { font-size:0.78rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="logo.png" alt="Logo Car Competence Center" class="logo" />

    <h1><span>Gökhan</span> <span>Budak</span></h1>
    <div class="role">Geschäftsführer</div>
    <div class="subrole">KFZ-Sachverständiger · KFZ-Lackierermeister HWK Ulm</div>

    <div class="quote-container">
      <p class="quote">"Spezialisiert auf Karosserie-Schadendiagnose<br>an Porsche-Fahrzeugen"</p>
    </div>

    <div class="grid">
      <!-- Phone 1 -->
      <a class="btn" href="tel:+4973194026800">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" aria-label="Telefon">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.9 19.9 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.9 19.9 0 0 1 2.08 4.18 2 2 0 0 1 4.06 2h3a2 2 0 0 1 2 1.72c.12.9.3 1.77.57 2.6a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.48-1.09a2 2 0 0 1 2.11-.45c.83.27 1.7.45 2.6.57A2 2 0 0 1 22 16.92Z"/>
          </svg>
        </span>
        <span class="txt">+49 731 940 26 800</span>
      </a>

      <!-- Phone 2 -->
      <a class="btn" href="tel:+4973194026400">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" aria-label="Telefon">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.9 19.9 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.9 19.9 0 0 1 2.08 4.18 2 2 0 0 1 4.06 2h3a2 2 0 0 1 2 1.72c.12.9.3 1.77.57 2.6a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.48-1.09a2 2 0 0 1 2.11-.45c.83.27 1.7.45 2.6.57A2 2 0 0 1 22 16.92Z"/>
          </svg>
        </span>
        <span class="txt">+49 731 940 26 40</span>
      </a>

      <!-- Printer / Fax -->
      <a class="btn" href="tel:+4973194026782">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" aria-label="Fax">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>

        <span class="txt">+49 731 940 26 782</span>

      <!-- Email (@) -->
      <a class="btn" href="mailto:info@budak-experts.de">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" aria-label="E-Mail">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-5.5 8.28"></path>
          </svg>
        </span>
        <span class="txt">info@budak-experts.de</span>
      </a>
    </div>

  </main>

</body>
</html>
